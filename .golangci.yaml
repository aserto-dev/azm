---
# Configuration
# https://golangci-lint.run/usage/configuration/

version: "2"

linters:
  # https://golangci-lint.run/usage/configuration/#linters-configuration
  default: all

  # explicitly disabled linters
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - gochecknoglobals  # no configuration options
    - gomodguard # is deprecated (since v2.12.0) due to: new major version.
    - nlreturn  # redundant with wsl
    - noinlineerr
    - paralleltest
    - revive
    - thelper
    - varnamelen
    - testableexamples
    - wrapcheck
    - wsl

  settings:
    cyclop:
      max-complexity: 12

    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Close

    funlen:
      lines: 80
      statements: 60
      ignore-comments: true

    gomoddirectives:
      replace-local: true

    ireturn:
      allow:
        - error
        - generic
        - io.Reader
        - model.objSet
        - model.relSet

    lll:
      line-length: 150

    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake

        overrides:
          - pkg: stats
            ignored-fields:
              - Count
              - ObjCount

    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2 

  exclusions:
    paths:
      - internal/golang-set/

    rules:
      - path: parser/
        linters:
          - forcetypeassert
          - ireturn

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
